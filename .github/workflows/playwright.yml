name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which tests to run'
        type: choice
        default: all
        options:
          - all
          - smoke
          - regression
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests (all)
      if: ${{ github.event.inputs.suite == '' || github.event.inputs.suite == 'all' }}
      run: npx playwright test
    - name: Run Playwright tests (smoke)
      if: ${{ github.event.inputs.suite == 'smoke' }}
      run: npx playwright test --grep @smoke
    - name: Run Playwright tests (regression)
      if: ${{ github.event.inputs.suite == 'regression' }}
      run: npx playwright test --grep @regression
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
